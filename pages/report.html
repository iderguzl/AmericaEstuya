<!doctype html>
<html lang="es">
<head>

<script src="../js/access-guard.js" data-access="authenticated"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f7fb;color:#163a5c}button,textarea{font:inherit}.topbar{height:68px;background:#fff;border-bottom:1px solid #dce7f0;display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;z-index:20}.back{border:0;background:#eef5fb;color:#07589b;border-radius:12px;width:42px;height:42px;font-size:24px;display:grid;place-items:center;cursor:pointer}.brand{font-size:20px;font-weight:900}.brand span{color:#08a6c7}.version{margin-left:auto;font-size:12px;font-weight:800;letter-spacing:.06em;color:#55748d;background:#edf4f9;border:1px solid #dce8f1;border-radius:999px;padding:7px 10px}.content{padding:28px}.card{max-width:1100px;margin:0 auto;background:#fff;border:1px solid #dce7f0;border-radius:20px;padding:22px;box-shadow:0 12px 30px #174c7410}.toolstrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px;background:#f7fafc;border:1px solid #e0eaf1;border-radius:14px;margin-bottom:14px}.action{border:1px solid #c8d9e6;background:#fff;color:#234f70;border-radius:10px;padding:9px 16px;font-weight:900;cursor:pointer}.action:hover{background:#eef6fb}.export-wrap{position:relative;margin-left:auto}.tool-btn{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:#315b7a;display:grid;place-items:center;cursor:pointer}.tool-btn:hover{background:#e8f3fb;color:#07589b}.tool-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.export-menu{display:none;position:absolute;top:44px;right:0;z-index:40;min-width:145px;background:#fff;border:1px solid #d7e4ed;border-radius:12px;box-shadow:0 12px 30px #153f6130;padding:6px}.export-menu.open{display:grid}.export-menu button{border:0;background:#fff;text-align:left;padding:10px;border-radius:8px;color:#244d6c;font-weight:700;cursor:pointer}.export-menu button:hover{background:#eef6fb}.editor{width:100%;min-height:210px;border:1px solid #cbdbe7;border-radius:12px;padding:12px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;line-height:1.45;color:#173f61;background:#fff;resize:vertical}.status{display:none;padding:11px 13px;border-radius:11px;margin-top:12px}.status.error{display:block;background:#fff1f1;color:#982f2f}.status.success{display:block;background:#edf9f1;color:#26784b}.grid-wrap{margin-top:16px;overflow:auto;border:1px solid #dce7f0;border-radius:14px;max-height:58vh}.grid{border-collapse:collapse;width:max-content;min-width:100%;background:#fff}.grid th,.grid td{border-bottom:1px solid #e5edf3;border-right:1px solid #eef3f7;padding:9px 11px;text-align:left;white-space:nowrap}.grid th{position:sticky;top:0;background:#eef5fb;color:#214c6c;font-weight:900;z-index:1}.grid td{color:#355b76}.empty{padding:25px;text-align:center;color:#6b8295}@media(max-width:760px){.content{padding:14px}.card{padding:14px;border-radius:16px}.brand{font-size:16px}.version{font-size:10px;padding:6px 7px}.editor{min-height:180px}}
</style>
</head>
<body>
<header class="topbar"><button class="back" type="button" aria-label="Volver" onclick="history.back()">←</button><div class="brand">🌎 América <span>es Tuya</span> · Generar Reporte</div><div class="version">V 3.0.1</div></header>
<main class="content"><section class="card"><div class="toolstrip"><button class="action" type="button" id="runQuery">Query</button><span class="export-wrap"><button class="tool-btn" type="button" id="exportBtn" title="Exportar" aria-label="Exportar"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg></button><span class="export-menu" id="exportMenu"><button data-format="csv">CSV</button><button data-format="pdf">PDF</button><button data-format="excel">EXCEL</button><button data-format="jpg">JPG</button></span></span></div><textarea id="sqlMemo" class="editor" spellcheck="false" placeholder="SELECT ..."></textarea><div id="status" class="status"></div><div id="gridWrap" class="grid-wrap"><div class="empty">Escribe un SELECT en el memo y pulsa Query.</div></div></section></main>
<script type="module">
const FIREBASE_CONFIG={apiKey:'AIzaSyCanpMR3uSiZAecwLYG9nWiXvaksJncX0U',authDomain:'americaestuya.firebaseapp.com',projectId:'americaestuya',storageBucket:'americaestuya.firebasestorage.app',messagingSenderId:'1071710933035',appId:'1:1071710933035:web:2443a0ec9f1405fcc61a6e',measurementId:'G-8K579LVLX1'};
const DATA_API_URL='https://ep-muddy-fire-awvetyx3.apirest.c-12.us-east-1.aws.neon.tech/americaestuya/rest/v1';
let rows=[],columns=[],token='';
const memo=document.getElementById('sqlMemo'),status=document.getElementById('status'),gridWrap=document.getElementById('gridWrap'),exportMenu=document.getElementById('exportMenu');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setStatus(text,type=''){status.textContent=text||'';status.className='status'+(type?' '+type:'')}
function normalizeQuery(sql){let text=String(sql??'').trim();if(!text)throw new Error('La consulta está vacía.');text=text.replace(/;\s*$/,'').trim();if(/;/.test(text))throw new Error('Query acepta una sola consulta SELECT.');if(!/^select\s/i.test(text))throw new Error('Query solo acepta SELECT.');if(/\sinto\s/i.test(text))throw new Error('SELECT INTO no está permitido.');return text}
async function ensureAuth(){if(token)return token;const [{initializeApp,getApps,getApp},{getAuth}]=await Promise.all([import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js')]);const app=getApps().length?getApp():initializeApp(FIREBASE_CONFIG);const auth=getAuth(app);if(typeof auth.authStateReady==='function')await auth.authStateReady();if(!auth.currentUser)throw new Error('No hay una sesión activa.');token=await auth.currentUser.getIdToken();return token}
function renderGrid(data){rows=Array.isArray(data)?data:[];columns=rows.length?[...new Set(rows.flatMap(r=>Object.keys(r)))]:[];if(!rows.length){gridWrap.innerHTML='<div class="empty">La consulta no devolvió filas.</div>';return}gridWrap.innerHTML=`<table class="grid"><thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${columns.map(c=>`<td>${esc(r[c]==null?'':typeof r[c]==='object'?JSON.stringify(r[c]):r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
async function runQuery(){try{setStatus('');const sql=normalizeQuery(memo.value);await ensureAuth();const r=await fetch(`${DATA_API_URL}/rpc/run_report_query`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json','X-America-Raw-State':'1'},body:JSON.stringify({p_sql:sql})});if(!r.ok)throw new Error(await r.text());const data=await r.json();const result=Array.isArray(data)?data:(Array.isArray(data?.result)?data.result:[]);renderGrid(result);setStatus(`${result.length} fila(s).`,'success')}catch(e){console.error(e);setStatus('ERROR REAL: '+(e?.message||e),'error')}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportCsv(){if(!rows.length)return;const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv=[columns.map(q).join(','),...rows.map(r=>columns.map(c=>q(r[c])).join(','))].join('\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'reporte.csv')}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportExcel(){if(!rows.length)return;if(!window.XLSX)await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');const ws=XLSX.utils.json_to_sheet(rows,{header:columns});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Reporte');XLSX.writeFile(wb,'reporte.xlsx')}
async function exportPdf(){if(!rows.length)return;if(!window.jspdf)await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js');if(!window.jspdf.jsPDF.API.autoTable)await loadScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js');const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape'});doc.autoTable({head:[columns],body:rows.map(r=>columns.map(c=>String(r[c]??''))),styles:{fontSize:7}});doc.save('reporte.pdf')}
function exportJpg(){if(!rows.length)return;const cw=180,rowH=28,w=Math.max(720,columns.length*cw),h=Math.min(12000,(rows.length+1)*rowH+20),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.font='bold 14px Arial';x.fillStyle='#173f61';columns.forEach((col,i)=>x.fillText(String(col).slice(0,22),i*cw+8,20));x.font='13px Arial';rows.slice(0,Math.floor((h-rowH)/rowH)).forEach((r,ri)=>{x.fillStyle='#355b76';columns.forEach((col,i)=>x.fillText(String(r[col]??'').slice(0,24),i*cw+8,(ri+2)*rowH-8))});c.toBlob(b=>b&&download(b,'reporte.jpg'),'image/jpeg',.92)}
document.getElementById('runQuery').addEventListener('click',runQuery);document.getElementById('exportBtn').addEventListener('click',()=>exportMenu.classList.toggle('open'));exportMenu.addEventListener('click',async e=>{const f=e.target.dataset.format;if(!f)return;exportMenu.classList.remove('open');if(f==='csv')exportCsv();if(f==='excel')await exportExcel();if(f==='pdf')await exportPdf();if(f==='jpg')exportJpg()});document.addEventListener('click',e=>{if(!e.target.closest('.export-wrap'))exportMenu.classList.remove('open')});
ensureAuth().catch(e=>setStatus('ERROR REAL: '+(e?.message||e),'error'));
</script>
</body></html>
