<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Países de América · América es Tuya</title>
<script src="../js/access-guard.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f9fd;color:#123b63}.topbar{height:64px;background:#fff;border-bottom:1px solid #d8e7f3;display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:1000}.back{border:0;background:#eaf5fc;color:#07589b;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.brand{font-size:20px;font-weight:900}.brand span{color:#08a6c7}.wrap{padding:18px;display:grid;grid-template-columns:270px 1fr;gap:18px}.list,.detail{background:#fff;border:1px solid #dbe8f2;border-radius:20px;box-shadow:0 12px 32px #003c6d18}.list{padding:14px;max-height:calc(100vh - 100px);overflow:auto}.search{width:100%;padding:12px 14px;border:1px solid #c8dce9;border-radius:12px;margin-bottom:10px}.item{width:100%;display:flex;align-items:center;gap:10px;border:0;background:#fff;padding:10px;border-radius:10px;text-align:left;cursor:pointer;color:#123b63;font-size:15px}.item:hover,.item.active{background:#e9f4ff;color:#07589b;font-weight:700}.item img{width:30px;height:20px;object-fit:cover;border:1px solid #d6e1e8}.detail{padding:18px}.head{display:flex;align-items:center;gap:16px;margin-bottom:14px}.head img{width:90px;max-height:60px;object-fit:cover;border:1px solid #d8e2ea}.head h1{font-size:34px;margin:0}.capital{margin:5px 0 0;color:#5c748a;font-size:17px}.map{height:480px;border-radius:16px;overflow:hidden;border:1px solid #cfe1ee}.note{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:10px 13px;border-radius:12px;background:#edf7ff;font-weight:700}.dot{width:12px;height:12px;border-radius:50%;background:#e21b23}@media(max-width:800px){.wrap{grid-template-columns:1fr;padding:10px}.list{max-height:250px}.map{height:380px}.head h1{font-size:28px}}
</style>
</head>
<body>
<header class="topbar"><button class="back" onclick="history.back()">← Volver</button><div class="brand">🌎 América <span>es Tuya</span></div></header>
<main class="wrap"><section class="list"><input id="search" class="search" placeholder="Buscar país…"><div id="countryList"></div></section><section class="detail"><div class="head"><img id="flag" alt="Bandera"><div><h1 id="name"></h1><div class="capital">Capital: <b id="capital"></b></div></div></div><div id="map" class="map"></div><div class="note"><span class="dot"></span><span id="label"></span></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const C=[['ARG','ar','Argentina','Buenos Aires',-34.6037,-58.3816],['BHS','bs','Bahamas','Nassau',25.0443,-77.3504],['BRB','bb','Barbados','Bridgetown',13.0975,-59.6167],['BLZ','bz','Belice','Belmopán',17.251,-88.759],['BOL','bo','Bolivia','Sucre',-19.0196,-65.2619],['BRA','br','Brasil','Brasilia',-15.7939,-47.8828],['CAN','ca','Canadá','Ottawa',45.4215,-75.6972],['CHL','cl','Chile','Santiago',-33.4489,-70.6693],['COL','co','Colombia','Bogotá',4.711,-74.0721],['CRI','cr','Costa Rica','San José',9.9281,-84.0907],['CUB','cu','Cuba','La Habana',23.1136,-82.3666],['DMA','dm','Dominica','Roseau',15.3092,-61.3794],['DOM','do','República Dominicana','Santo Domingo',18.4861,-69.9312],['ECU','ec','Ecuador','Quito',-0.1807,-78.4678],['SLV','sv','El Salvador','San Salvador',13.6929,-89.2182],['GRD','gd','Granada','Saint George’s',12.0561,-61.7488],['GTM','gt','Guatemala','Ciudad de Guatemala',14.6349,-90.5069],['GUY','gy','Guyana','Georgetown',6.8013,-58.1551],['HTI','ht','Haití','Puerto Príncipe',18.5944,-72.3074],['HND','hn','Honduras','Tegucigalpa',14.0723,-87.1921],['JAM','jm','Jamaica','Kingston',17.9712,-76.7936],['MEX','mx','México','Ciudad de México',19.4326,-99.1332],['NIC','ni','Nicaragua','Managua',12.114,-86.2362],['PAN','pa','Panamá','Ciudad de Panamá',8.9824,-79.5199],['PRY','py','Paraguay','Asunción',-25.2637,-57.5759],['PER','pe','Perú','Lima',-12.0464,-77.0428],['KNA','kn','San Cristóbal y Nieves','Basseterre',17.3026,-62.7177],['LCA','lc','Santa Lucía','Castries',14.0101,-60.9875],['VCT','vc','San Vicente y las Granadinas','Kingstown',13.16,-61.2248],['SUR','sr','Surinam','Paramaribo',5.852,-55.2038],['TTO','tt','Trinidad y Tobago','Puerto España',10.6549,-61.5019],['USA','us','Estados Unidos','Washington D. C.',38.9072,-77.0369],['URY','uy','Uruguay','Montevideo',-34.9011,-56.1645],['VEN','ve','Venezuela','Caracas',10.4806,-66.9036],['ATG','ag','Antigua y Barbuda','Saint John’s',17.1274,-61.8468]].map(([iso3,iso2,name,capital,lat,lng])=>({iso3,iso2,name,capital,lat,lng}));
let current='CUB',geo=null,layer=null,marker=null;
const map=L.map('map').setView([15,-75],3);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
function renderList(list=C){countryList.innerHTML=list.map(c=>`<button class="item ${c.iso3===current?'active':''}" data-iso="${c.iso3}"><img src="https://flagcdn.com/w80/${c.iso2}.png" alt="">${c.name}</button>`).join('');countryList.querySelectorAll('.item').forEach(b=>b.onclick=()=>show(b.dataset.iso));}
function show(iso){const c=C.find(x=>x.iso3===iso)||C.find(x=>x.iso3==='CUB');current=c.iso3;name.textContent=c.name;capital.textContent=c.capital;label.textContent='Capital: '+c.capital;flag.src=`https://flagcdn.com/w320/${c.iso2}.png`;flag.alt='Bandera de '+c.name;renderList(C.filter(x=>x.name.toLowerCase().includes(search.value.toLowerCase())));if(layer)map.removeLayer(layer);if(marker)map.removeLayer(marker);const f=geo?.features?.find(x=>(x.properties.ISO_A3||x.properties.iso_a3||x.properties.ADM0_A3)===c.iso3);if(f){layer=L.geoJSON(f,{style:{weight:3,fillOpacity:.28}}).addTo(map);map.fitBounds(layer.getBounds(),{padding:[28,28],maxZoom:6});}else map.setView([c.lat,c.lng],5);marker=L.circleMarker([c.lat,c.lng],{radius:8,weight:2,fillOpacity:1}).addTo(map).bindTooltip('Capital: '+c.capital,{permanent:true,direction:'top',offset:[0,-8]}).openTooltip();setTimeout(()=>map.invalidateSize(),100);}
search.oninput=()=>renderList(C.filter(c=>c.name.toLowerCase().includes(search.value.toLowerCase())));renderList();fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson').then(r=>r.json()).then(g=>{geo=g;show('CUB')}).catch(()=>show('CUB'));
</script>
</body>
</html>
