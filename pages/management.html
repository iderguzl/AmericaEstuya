<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión · América es Tuya</title>
<script src="../js/access-guard.js" data-access="authenticated"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f7fb;color:#163a5c}
button,input,select,textarea{font:inherit}.topbar{height:68px;background:#fff;border-bottom:1px solid #dce7f0;display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;z-index:20}
.back{border:0;background:#eef5fb;color:#07589b;border-radius:12px;width:42px;height:42px;font-size:24px;display:grid;place-items:center;cursor:pointer}
.brand{font-size:20px;font-weight:900}.brand span{color:#08a6c7}.version{margin-left:auto;font-size:12px;font-weight:800;letter-spacing:.06em;color:#55748d;background:#edf4f9;border:1px solid #dce8f1;border-radius:999px;padding:7px 10px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{background:#fff;border-right:1px solid #dce7f0;padding:22px 14px}.side-title{font-size:12px;font-weight:900;letter-spacing:.12em;color:#7890a4;margin:0 12px 12px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:6px}.nav a{display:flex;align-items:center;gap:12px;text-decoration:none;color:#385870;border-radius:13px;padding:12px 13px;font-weight:700}.nav a:hover{background:#f1f7fb}.nav a.active{background:#e7f3fc;color:#07589b;box-shadow:inset 3px 0 0 #0b84d8}.nav .icon{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:#eff5f9;font-size:16px}.nav a.active .icon{background:#cfe9fb}
.mobile-picker{display:none;padding:14px 16px 0}.mobile-picker label{display:block;font-size:12px;font-weight:800;color:#6d8599;margin:0 0 6px}.mobile-picker select{width:100%;height:46px;border:1px solid #cfdeea;border-radius:12px;background:#fff;color:#173f61;font-size:16px;font-weight:700;padding:0 12px}
.content{padding:28px}.card{max-width:980px;background:#fff;border:1px solid #dce7f0;border-radius:20px;padding:26px;box-shadow:0 12px 30px #174c7410}.section{display:none}.section.active{display:block}
.section-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}.section-head h1{margin:0;font-family:Georgia,serif;font-size:38px}.section-title-redundant{display:none}
.status{display:none;padding:11px 13px;border-radius:11px;margin-bottom:14px}.status.error{display:block;background:#fff1f1;color:#982f2f}.status.success{display:block;background:#edf9f1;color:#26784b}
.toolstrip{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:8px;background:#f7fafc;border:1px solid #e0eaf1;border-radius:14px;margin-bottom:16px}.section.active>.toolstrip{position:sticky;top:68px;z-index:19}.export-popover{position:fixed;z-index:10000;display:grid;min-width:150px;background:#fff;border:1px solid #d7e4ed;border-radius:12px;box-shadow:0 14px 38px #173f6140;padding:6px}.export-popover button{border:0;background:#fff;text-align:left;padding:10px 12px;border-radius:8px;color:#244d6c;font-weight:800;cursor:pointer}.export-popover button:hover{background:#eef6fb}.tool-btn{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:#315b7a;display:grid;place-items:center;cursor:pointer}.tool-btn:hover{background:#e8f3fb;color:#07589b}.tool-btn:disabled{opacity:.3;cursor:default;background:transparent}.tool-btn.active{background:#dceffc;color:#07589b}.tool-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tool-sep{width:1px;height:25px;background:#d7e4ed;margin:0 3px}
.details{display:grid;grid-template-columns:190px 1fr;border:1px solid #e1ebf2;border-radius:15px;overflow:hidden}.details div{padding:13px 15px;border-bottom:1px solid #e8eff4}.details div:nth-last-child(-n+2){border-bottom:0}.label{font-weight:800;background:#f7fafc}.value{overflow-wrap:anywhere}.active-value{color:#237a4b;font-weight:800}
.additional-box{margin-top:18px;border:1px solid #e1ebf2;border-radius:15px;overflow:hidden}.additional-title{padding:12px 15px;background:#f7fafc;font-weight:900;color:#315b7a}.additional-body{padding:15px;color:#6b8295}
.client-form{display:none;border:1px solid #dce7f0;background:#f9fbfd;border-radius:15px;padding:18px;margin-bottom:18px}.client-form.open{display:block}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800;color:#55748d}.field input,.field select,.field textarea{border:1px solid #cbdbe7;border-radius:10px;padding:0 11px;background:#fff;color:#173f61}.field input,.field select{height:43px}.field textarea{min-height:90px;padding:10px 11px;resize:vertical}
.form-actions{display:flex;gap:9px;margin-top:15px}.primary{border:0;background:#0b78c5;color:#fff;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}.secondary{border:1px solid #cbdbe7;background:#fff;color:#28506f;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.searchbar{display:none;gap:8px;margin-bottom:14px}.searchbar.open{display:flex}.searchbar input,.searchbar select{height:42px;border:1px solid #cbdbe7;border-radius:10px;padding:0 11px;background:#fff;color:#173f61}.searchbar input{flex:1;min-width:0}
.clients-list{display:grid;gap:10px}.client-row{display:grid;grid-template-columns:minmax(0,1.7fr) auto;gap:14px;align-items:center;border:1px solid #e0eaf1;border-radius:14px;padding:14px 15px;background:#fff;cursor:pointer}.client-row:hover{border-color:#b9d4e8;background:#fbfdff}.client-row.selected{border-color:#1785d1;box-shadow:0 0 0 2px #1785d119;background:#f3f9fd}.client-name{font-weight:900;font-size:17px;color:#153f61}.client-meta{margin-top:5px;color:#6b8295;font-size:13px;display:flex;gap:10px;flex-wrap:wrap}.client-state{font-size:12px;font-weight:900;border-radius:999px;padding:6px 9px;background:#edf8f1;color:#29774d}.client-state.off{background:#f3f4f6;color:#6b7280}.no-items{padding:20px;border:1px dashed #cfdde8;border-radius:14px;color:#6a8093;text-align:center}.placeholder{padding:28px 0;color:#6a8093}
@media(max-width:760px){.shell{display:block}.sidebar{display:none}.mobile-picker{display:block;padding:8px 0;background:#f4f7fb;position:sticky;top:124px;z-index:18}.content{padding:14px}.card{padding:18px;border-radius:16px}.section.active>.toolstrip{position:sticky;top:68px;z-index:19;flex-wrap:nowrap;overflow-x:auto;margin-bottom:0;background:#f7fafc}.section.active>.toolstrip+.mobile-picker{margin-bottom:14px}.details{grid-template-columns:1fr}.details .label{border-bottom:0;padding-bottom:4px}.details .value{padding-top:4px}.details div:nth-last-child(-n+2){border-bottom:1px solid #e8eff4}.details div:last-child{border-bottom:0}.brand{font-size:16px}.version{font-size:10px;padding:6px 7px}.toolstrip{gap:2px}.tool-btn{width:38px;height:38px;flex:0 0 38px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.client-row{grid-template-columns:1fr auto}.searchbar{flex-direction:column}.searchbar input,.searchbar select{width:100%}}
@media print{.topbar,.sidebar,.mobile-picker,.toolstrip,.searchbar,.form-actions,.client-form{display:none!important}.shell{display:block}.content{padding:0}.card{max-width:none;border:0;box-shadow:none;padding:0}.section{display:none!important}.section.active{display:block!important}}
</style>
</head>
<body>
<header class="topbar"><button class="back" type="button" aria-label="Volver" onclick="history.back()">←</button><div class="brand">🌎 América <span>es Tuya</span> · Gestión</div><div class="version">V 4.1.5</div></header>
<div class="mobile-picker"><label for="sectionSelect">Sección</label><select id="sectionSelect"><option value="account">Cuenta</option><option value="clients">Beneficiarios</option><option value="relationships">Relaciones</option><option value="configuration">Configuración</option></select></div>
<div class="shell">
<aside class="sidebar"><div class="side-title">Gestión</div><nav class="nav" aria-label="Gestión"><a href="#account" class="active" data-section="account"><span class="icon">👤</span><span>Cuenta</span></a><a href="#clients" data-section="clients"><span class="icon">👥</span><span>Beneficiarios</span></a><a href="#relationships" data-section="relationships"><span class="icon">🤝</span><span>Relaciones</span></a><a href="#configuration" data-section="configuration"><span class="icon">⚙️</span><span>Configuración</span></a></nav></aside>
<main class="content">
<section id="account" class="card section active"><div class="section-head section-title-redundant"><h1>Cuenta</h1></div><div class="toolstrip" data-tools="account"></div><div id="accountStatus" class="status"></div><div id="accountDetails" class="details" hidden><div class="label">Nombre</div><div id="displayName" class="value"></div><div class="label">Correo</div><div id="email" class="value"></div><div class="label">Fecha de creación</div><div id="createdAt" class="value"></div><div class="label">Último acceso</div><div id="lastLoginAt" class="value"></div><div class="label">Estado</div><div id="isActive" class="value"></div></div><div class="additional-box"><div class="additional-title">Datos adicionales</div><div class="additional-body" id="accountAdditional">—</div></div></section>
<section id="clients" class="card section"><div class="section-head section-title-redundant"><h1>Beneficiarios</h1></div><div class="toolstrip" data-tools="clients"></div><div id="clientStatus" class="status"></div><div id="clientSearch" class="searchbar"><input id="clientSearchText" type="search" placeholder="Buscar"><select id="clientFilter"><option value="all">Todos</option><option value="active">Activos</option><option value="inactive">Inactivos</option></select></div><form id="clientForm" class="client-form"><input id="clientId" type="hidden"><div class="form-grid"><div class="field full"><label for="clientName">Nombre</label><input id="clientName" maxlength="150" required></div><div class="field"><label for="clientEmail">Correo</label><input id="clientEmail" type="email" maxlength="320"></div><div class="field"><label for="clientPhone">Teléfono</label><input id="clientPhone" maxlength="40"></div><div class="field"><label for="clientCategory">Categoría</label><select id="clientCategory"><option value="">Seleccione…</option></select></div><div class="field"><label for="clientActive">Estado</label><select id="clientActive"><option value="true">Activo</option><option value="false">Inactivo</option></select></div></div><div class="form-actions"><button id="cancelClientBtn" class="secondary" type="button">Cancelar</button></div></form><div id="clientsList" class="clients-list"><div class="no-items">Cargando…</div></div><div class="additional-box"><div class="additional-title">Datos adicionales</div><div class="additional-body" id="clientAdditional">Selecciona un beneficiario.</div></div></section>

<section id="relationships" class="card section"><div class="section-head"><h1>Relaciones</h1></div><div class="placeholder">—</div></section>
<section id="configuration" class="card section"><div class="placeholder">—</div></section>
</main></div>

<script type="module" src="../js/management-config.js"></script>

</body></html>
