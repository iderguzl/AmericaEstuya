:14px;margin-bottom:14px}.section-head h1{margin:0;font-family:Georgia,serif;font-size:38px}.status{display:none;padding:11px 13px;border-radius:11px;margin-bottom:14px}.status.error{display:block;background:#fff1f1;color:#982f2f}.status.success{display:block;background:#edf9f1;color:#26784b}.toolstrip{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:8px;background:#f7fafc;border:1px solid #e0eaf1;border-radius:14px;margin-bottom:16px}.tool-btn{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:#315b7a;display:grid;place-items:center;cursor:pointer}.tool-btn:hover{background:#e8f3fb;color:#07589b}.tool-btn:disabled{opacity:.3;cursor:default;background:transparent}.tool-btn.active{background:#dceffc;color:#07589b}.tool-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tool-sep{width:1px;height:25px;background:#d7e4ed;margin:0 3px}.details{display:grid;grid-template-columns:190px 1fr;border:1px solid #e1ebf2;border-radius:15px;overflow:hidden}.details div{padding:13px 15px;border-bottom:1px solid #e8eff4}.details div:nth-last-child(-n+2){border-bottom:0}.label{font-weight:800;background:#f7fafc}.value{overflow-wrap:anywhere}.active-value{color:#237a4b;font-weight:800}.additional-box{margin-top:18px;border:1px solid #e1ebf2;border-radius:15px;overflow:hidden}.additional-title{padding:12px 15px;background:#f7fafc;font-weight:900;color:#315b7a}.additional-body{padding:15px;color:#6b8295}.client-form{display:none;border:1px solid #dce7f0;background:#f9fbfd;border-radius:15px;padding:18px;margin-bottom:18px}.client-form.open{display:block}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800;color:#55748d}.field input,.field select{height:43px;border:1px solid #cbdbe7;border-radius:10px;padding:0 11px;background:#fff;color:#173f61}. <body>

<section id="relationships" class="card section"><div class="section-head"><h1>Relaciones</h1></div><div class="placeholder">—</div></section><section id="configuration" class="card section"><div class="section-head"><h1>Configuración</h1></div><div class="placeholder">—</div></section>

<script type="module">
const FIREBASE_CONFIG={apiKey:'AIzaSyCanpMR3uSiZAecwLYG9nWiXvaksJncX0U',authDomain:'americaestuya.firebaseapp.com',projectId:'americaestuya',storageBucket:'americaestuya.firebasestorage.app',messagingSenderId:'1071710933035',appId:'1:1071710933035:web:2443a0ec9f1405fcc61a6e',measurementId:'G-8K579LVLX1'};
const DATA_API_URL='https://ep-muddy-fire-awvetyx3.apirest.c-12.us-east-1.aws.neon.tech/americaestuya/rest/v1';
const status=document.getElementById('accountStatus'),details=document.getElementById('accountDetails'),picker=document.getElementById('sectionSelect'),clientStatus=document.getElementById('clientStatus'),clientForm=document.getElementById('clientForm'),clientsList=document.getElementById('clientsList');
const fmt=v=>v?new Intl.DateTimeFormat('es-US',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';
let currentToken='',currentAccount=null,clientsCache=[],selectedClientId=null,clientSortAsc=true;
const icons={new:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>',delete:'<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',filter:'<svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8Z"/></svg>',sort:'<svg viewBox="0 0 24 24"><path d="M8 6v12M5 9l3-3 3 3M16 18V6M13 15l3 3 3-3"/></svg>',print:'<svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>',export:'<svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg>'};
function toolButton(action,label,disabled=false){return `<button class="tool-btn" type="button" data-action="${action}" title="${label}" aria-label="${label}" ${disabled?'disabled':''}>${icons[action]}</button>`}
function buildTools(kind){const h=document.querySelector(`[data-tools="${kind}"]`);if(!h)return;const disableEdit=kind!=='clients',disableNew=kind==='account';h.innerHTML=toolButton('new','Nuevo',disableNew)+toolButton('edit','Modificar',disableEdit)+toolButton('delete','Eliminar',disableEdit)+'<span class="tool-sep"></span>'+toolButton('search','Buscar',kind==='account')+toolButton('filter','Filtrar',kind==='account')+toolButton('sort','Ordenar A–Z / Z–A',kind==='account')+'<span class="tool-sep"></span>'+toolButton('print','Imprimir')+toolButton('export','Exportar');h.addEventListener('click',e=>{const b=e.target.closest('.tool-btn');if(!b||b.disabled)return;handleTool(kind,b.dataset.action,b)})}['account','clients','users'].forEach(buildTools);
function showSection(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav a').forEach(x=>x.classList.toggle('active',x.dataset.section===id));if(picker)picker.value=id;if(id==='clients'&&currentAccount)loadClients()}document.querySelectorAll('.nav a').forEach(link=>link.addEventListener('click',e=>{e.preventDefault();showSection(link.dataset.section)}));if(picker)picker.addEventListener('change',()=>showSection(picker.value));
function setClientMessage(message,type=''){clientStatus.textContent=message||'';clientStatus.className='status'+(type?' '+type:'')}
function resetClientForm(){clientId.value='';clientName.value='';clientEmail.value='';clientPhone.value='';clientActive.value='true'}function openClientForm(client=null){resetClientForm();if(client){clientId.value=client.client_id;clientName.value=client.name||'';clientEmail.value=client.email||'';clientPhone.value=client.phone||'';clientActive.value=String(client.is_active!==false)}clientForm.classList.add('open');clientName.focus()}function closeClientForm(){clientForm.classList.remove('open');resetClientForm()}document.getElementById('cancelClientBtn').addEventListener('click',closeClientForm);document.getElementById('clientSearchText').addEventListener('input',renderClients);document.getElementById('clientFilter').addEventListener('change',renderClients);
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function visibleClients(){const q=clientSearchText.value.trim().toLowerCase(),f=clientFilter.value;return [...clientsCache].filter(c=>(!q||[c.name,c.email,c.phone].some(v=>String(v||'').toLowerCase().includes(q)))&&(f==='all'||(f==='active'&&c.is_active!==false)||(f==='inactive'&&c.is_active===false))).sort((a,b)=>{const n=String(a.name||'').localeCompare(String(b.name||''),'es',{sensitivity:'base'});return clientSortAsc?n:-n})}
function renderClients(){const rows=visibleClients();if(!rows.length){clientsList.innerHTML='<div class="no-items">Sin resultados</div>';return}clientsList.innerHTML=rows.map(c=>`<div class="client-row ${String(c.client_id)===String(selectedClientId)?'selected':''}" tabindex="0" data-id="${c.client_id}"><div><div class="client-name">${escapeHtml(c.name||'')}</div><div class="client-meta">${c.email?`<span>${escapeHtml(c.email)}</span>`:''}${c.phone?`<span>${escapeHtml(c.phone)}</span>`:''}</div></div><span class="client-state ${c.is_active===false?'off':''}">${c.is_active===false?'Inactivo':'Activo'}</span></div>`).join('');clientsList.querySelectorAll('.client-row').forEach(row=>{const select=()=>{selectedClientId=row.dataset.id;renderClients()};row.addEventListener('click',select);row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}})})}
async function loadClients(){if(!currentAccount||!currentToken)return;try{const r=await fetch(`${DATA_API_URL}/clients?select=client_id,name,email,phone,is_active,created_at,updated_at&account_id=eq.${currentAccount.account_id}`,{headers:{Authorization:`Bearer ${currentToken}`}});if(!r.ok)throw new Error(await r.text());clientsCache=await r.json();renderClients();setClientMessage('')}catch(e){console.error(e);setClientMessage('No se pudieron cargar los clientes.','error')}}
clientForm.addEventListener('submit',async e=>{e.preventDefault();if(!currentAccount||!currentToken)return;const id=clientId.value,payload={name:clientName.value.trim(),email:clientEmail.value.trim()||null,phone:clientPhone.value.trim()||null,is_active:clientActive.value==='true',updated_at:new Date().toISOString()};if(!payload.name)return;let url=`${DATA_API_URL}/clients`,method='POST';if(id){url+=`?client_id=eq.${encodeURIComponent(id)}&account_id=eq.${currentAccount.account_id}`;method='PATCH'}else payload.account_id=currentAccount.account_id;try{const r=await fetch(url,{method,headers:{Authorization:`Bearer ${currentToken}`,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());closeClientForm();selectedClientId=null;await loadClients();setClientMessage('Guardado.','success');setTimeout(()=>setClientMessage(''),1300)}catch(err){console.error(err);setClientMessage('No se pudo guardar.','error')}});
function selectedClient(){return clientsCache.find(c=>String(c.client_id)===String(selectedClientId))||null}async function softDeleteClient(){const c=selectedClient();if(!c){setClientMessage('Selecciona un cliente.','error');return}if(!confirm(`¿Eliminar ${c.name}?`))return;try{const r=await fetch(`${DATA_API_URL}/clients?client_id=eq.${c.client_id}&account_id=eq.${currentAccount.account_id}`,{method:'PATCH',headers:{Authorization:`Bearer ${currentToken}`,'Content-Type':'application/json'},body:JSON.stringify({is_active:false,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error(await r.text());selectedClientId=null;await loadClients()}catch(e){console.error(e);setClientMessage('No se pudo eliminar.','error')}}
function exportClients(){const rows=visibleClients(),esc=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=['Nombre,Correo,Telefono,Estado',...rows.map(c=>[c.name,c.email,c.phone,c.is_active===false?'Inactivo':'Activo'].map(esc).join(','))].join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clientes.csv';a.click();URL.revokeObjectURL(a.href)}
function exportAccount(){if(!currentAccount)return;const data={nombre:currentAccount.display_name,correo:currentAccount.email,creada:currentAccount.created_at,ultimo_acceso:currentAccount.last_login_at,estado:currentAccount.is_active},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cuenta.json';a.click();URL.revokeObjectURL(a.href)}
function handleTool(kind,action,button){if(action==='print'){window.print();return}if(action==='export'){kind==='clients'?exportClients():kind==='account'?exportAccount():null;return}if(kind!=='clients')return;if(action==='new'){selectedClientId=null;renderClients();openClientForm();return}if(action==='edit'){const c=selectedClient();c?openClientForm(c):setClientMessage('Selecciona un cliente.','error');return}if(action==='delete'){softDeleteClient();return}if(action==='search'){clientSearch.classList.toggle('open');button.classList.toggle('active');return}if(action==='filter'){clientSearch.classList.add('open');clientFilter.focus();return}if(action==='sort'){clientSortAsc=!clientSortAsc;button.classList.toggle('active',!clientSortAsc);button.title=clientSortAsc?'Ordenar A–Z':'Ordenar Z–A';renderClients()}}
async function loadAccount(){try{const [{initializeApp,getApps,getApp},{getAuth,onAuthStateChanged}]=await Promise.all([import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js')]);const app=getApps().length?getApp():initializeApp(FIREBASE_CONFIG),auth=getAuth(app);onAuthStateChanged(auth,async user=>{if(!user){status.textContent='No hay una sesión activa.';status.classList.add('error');return}try{currentToken=await user.getIdToken();const r=await fetch(`${DATA_API_URL}/accounts?select=account_id,email,display_name,created_at,last_login_at,is_active&auth_uid=eq.${encodeURIComponent(user.uid)}`,{headers:{Authorization:`Bearer ${currentToken}`}});if(!r.ok)throw new Error(await r.text());const rows=await r.json();currentAccount=rows[0];if(!currentAccount)throw new Error('Cuenta no encontrada');displayName.textContent=currentAccount.display_name||'—';email.textContent=currentAccount.email||'—';createdAt.textContent=fmt(currentAccount.created_at);lastLoginAt.textContent=fmt(currentAccount.last_login_at);isActive.textContent=currentAccount.is_active?'Activo':'Inactivo';isActive.className='value '+(currentAccount.is_active?'active-value':'');status.textContent='';status.classList.remove('error');details.hidden=false;if(document.getElementById('clients').classList.contains('active'))loadClients()}catch(e){console.error(e);status.textContent='No se pudo cargar la cuenta.';status.classList.add('error')}})}catch(e){console.error(e);status.textContent='No se pudo cargar la cuenta.';status.classList.add('error')}}loadAccount();
</script>
