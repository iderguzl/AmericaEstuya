<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>América es Tuya</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f4f9fd;color:#123b63}
.auth-gate{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#062f57,#0b74b8 55%,#12a6cf);padding:24px}
.auth-card{width:min(430px,100%);background:#fff;border-radius:26px;padding:32px;box-shadow:0 24px 70px #001f3f66;text-align:center}
.auth-logo{width:82px;height:82px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(145deg,#14b8d4,#07539b);color:#fff;font-size:42px}
h1{margin:4px 0 8px;font-size:34px}.sub{color:#5d7287;line-height:1.5;margin-bottom:22px}
.auth-btn{width:100%;border:1px solid #d7e2ea;background:#fff;border-radius:14px;padding:14px 16px;margin:7px 0;font-size:16px;font-weight:700;cursor:pointer}
.auth-btn:hover{background:#f5f9fc}.auth-btn:disabled{opacity:.55;cursor:not-allowed}.auth-status{min-height:22px;margin-top:12px;color:#6c7d8f;font-size:14px;overflow-wrap:anywhere}
.connected-photo{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:6px auto 14px;display:block;border:4px solid #e7f2fb}
.connected-name{font-size:22px;font-weight:800;margin:4px 0 6px}.connected-ok{color:#2f6d4f;font-weight:700;margin-bottom:18px}
.primary-enter{background:#0b74b8;color:#fff;border-color:#0b74b8}.secondary-logout{background:#f3f7fa;color:#123b63}.guest-enter{background:#eef8fc;color:#07539b;border-color:#b9ddeb}
#siteApp{display:none;width:100%;height:100vh}.appbar{height:54px;background:#fff;border-bottom:1px solid #d8e7f3;display:flex;align-items:center;padding:0 12px;gap:9px}.appbar b{font-size:18px}.brand2{color:#08a6c7}
.location-btn{margin-left:auto;display:flex;align-items:center;gap:5px;max-width:42%;border:0;background:#edf5fb;color:#123b63;border-radius:10px;padding:7px 9px;cursor:pointer;font-size:12px}.location-btn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.location-pin{font-size:18px}
.userbox{display:flex;align-items:center;gap:8px;font-size:13px}.userbox img{width:32px;height:32px;border-radius:50%;object-fit:cover}.logout{border:0;background:#edf5fb;color:#123b63;border-radius:10px;padding:8px 10px;cursor:pointer}
iframe{display:block;width:100%;height:calc(100vh - 54px);border:0;background:white}
@media(max-width:700px){.appbar b{font-size:15px}.location-btn{max-width:38%;padding:7px}.location-btn span:last-child{max-width:125px}.userbox span{display:none}.logout{padding:7px;font-size:12px}}
</style>
</head>
<body>
<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-logo">🌎</div>
    <h1>América es Tuya</h1>
    <p class="sub">Inicia sesión con Google o entra como invitado.</p>
    <button id="googleLogin" class="auth-btn">Continuar con Google</button>
    <button id="guestLogin" class="auth-btn guest-enter">Entrar como Invitado</button>
    <button id="facebookLogin" class="auth-btn" hidden aria-hidden="true">Continuar con Facebook</button>
    <div id="authStatus" class="auth-status"></div>
  </div>
</div>

<div id="connectedGate" class="auth-gate" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">✓</div>
    <img id="connectedPic" class="connected-photo" alt="" hidden>
    <div class="connected-ok">Conexión realizada correctamente</div>
    <div id="connectedName" class="connected-name">Usuario</div>
    <p class="sub">Tu cuenta está conectada. Ahora puedes entrar a América es Tuya.</p>
    <button id="enterSiteBtn" class="auth-btn primary-enter">Entrar a América es Tuya</button>
    <button id="connectedLogoutBtn" class="auth-btn secondary-logout">Cerrar sesión</button>
  </div>
</div>

<div id="siteApp">
  <div class="appbar">
    <b>🌎 América <span class="brand2">es Tuya</span></b>
    <button id="locationBtn" class="location-btn" type="button" title="Mi ubicación">
      <span class="location-pin">📍</span><span id="locationLabel">Mi ubicación</span>
    </button>
    <div id="userBox" class="userbox" hidden>
      <img id="userPic" alt="" hidden>
      <span id="userName"></span>
      <button id="logoutBtn" class="logout">Cerrar sesión</button>
    </div>
  </div>
  <iframe src="site.html?v=20260909-location1" title="América es Tuya"></iframe>
</div>
<script type="module" src="auth.js?v=20260909-guest1"></script>
<script src="location.js?v=20260909-1"></script>
<script src="countries.js?v=20260907-1"></script>
</body>
</html>
